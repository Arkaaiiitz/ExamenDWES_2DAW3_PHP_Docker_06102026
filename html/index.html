<html>
    <head>
        <title>Examen de Desarrollo web en entorno servidor</title>
        <link rel="stylesheet" type="text/css" href="../estilos/estilos.css">
        <link rel="icon" type="image/png" sizes="32x32" href="../imagenes/favicon.jpeg">
    </head>
    <body>
        <h1>Centro de Ayuda al Empleo</h1>
        <h2>Formulario de solicitud</h2>
        <button onclick="location.href='../php/tabla.php?tipo=soldadura'">Soldadura</button>
        <button onclick="location.href='../php/tabla.php?tipo=informatica'">Informática</button>
        <button onclick="location.href='../php/tabla.php?tipo=socio'">Asistencia Sociosanitaria</button>
        <form action="../php/tabla.php" method="post">
            <input type="text" name="nombre" placeholder="Nombre" required>
            <br>
            <input type="text" name="apellidos" placeholder="Apellidos" required>
            <br>
            <input type="text" name="dni" placeholder="DNI" required>
            <br>
            <input type="date" name="f_nac" placeholder="Fecha de Nacimiento" required>
            <br>
            <input type="tel" name="tlf" placeholder="Teléfono" required>
            <br>
            <input type="email" name="email" placeholder="Correo Electrónico" required>
            <br>
            <select name="profesion" required>
                <option value="soldadura">Soldadura</option>
                <option value="informatica">Informática</option>
                <option value="socio">Asistencia Sociosanitaria</option>
            </select>
            <br>
            <label class="opcion-radio">
                <input type="radio" name="jornadaParcial" value="0" checked required>
                Jornada Parcial
            </label>
            <label class="opcion-radio">
                <input type="radio" name="jornadaParcial" value="1" required>
                Jornada Completa
            </label>
            <br>
            <label class="opcion-radio">
                <input type="checkbox" name="idiomas[]" value="Euskera">
                Euskera
            </label>
            <label class="opcion-radio">
                <input type="checkbox" name="idiomas[]" value="Ingles">
                Ingles
            </label>
            <input type="submit" value="Enviar">
        </form>
    </body>
</html>
